name: AIUI Coding Benchmark

on:
  workflow_dispatch:
    inputs:
      model_deepseek_flash:
        description: Run with deepseek-flash
        type: boolean
        default: true
      model_deepseek_v4_pro:
        description: Run with deepseek-v4-pro
        type: boolean
        default: false
      max_steps:
        description: Maximum model turns per task (1-100)
        type: number
        required: true
        default: 30

permissions:
  contents: read

jobs:
  benchmark:
    name: Run selected models
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check provider credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -z "$DEEPSEEK_API_KEY" ]]; then
            echo '::error::Configure the repository secret DEEPSEEK_API_KEY before running this workflow.'
            exit 1
          fi

      - name: Test benchmark harness
        run: npm run bench:test

      - name: Run all benchmark tasks
        id: bench
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL_DEEPSEEK_FLASH: ${{ inputs.model_deepseek_flash }}
          MODEL_DEEPSEEK_V4_PRO: ${{ inputs.model_deepseek_v4_pro }}
          BENCH_MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          models=()
          if [[ "$MODEL_DEEPSEEK_FLASH" == 'true' ]]; then models+=(deepseek-flash); fi
          if [[ "$MODEL_DEEPSEEK_V4_PRO" == 'true' ]]; then models+=(deepseek-v4-pro); fi
          if (( ${#models[@]} == 0 )); then
            echo '::error::Select at least one model.'
            exit 2
          fi

          failed=0
          for model in "${models[@]}"; do
            output_dir="bench/results/github-actions/$model"
            status=0
            node bench/scripts/run-all.js \
              --model "$model" \
              --max-steps "$BENCH_MAX_STEPS" \
              --output-dir "$output_dir" || status=$?
            if (( status > 1 )) || [[ ! -s "$output_dir/summary.json" || ! -s "$output_dir/report.md" ]]; then
              echo "::error::Benchmark run for $model did not complete (exit $status)."
              failed=1
            fi
          done
          exit "$failed"

      - name: Publish benchmark summary
        if: ${{ always() }}
        run: |
          node bench/scripts/github-summary.js bench/results/github-actions >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: ${{ always() && steps.bench.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: aiui-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench/results/github-actions/
          if-no-files-found: warn
          retention-days: 14
