name: AIUI Bench (DeepSeek)

on:
  workflow_dispatch:
    inputs:
      model:
        description: DeepSeek model
        type: choice
        required: true
        default: deepseek-flash
        options:
          - deepseek-flash
          - deepseek-v4-pro
      max_steps:
        description: Maximum model turns per task (1-100)
        type: number
        required: true
        default: 30

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check DeepSeek secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -z "$DEEPSEEK_API_KEY" ]]; then
            echo '::error::Configure the repository secret DEEPSEEK_API_KEY before running this workflow.'
            exit 1
          fi

      - name: Test benchmark harness
        run: npm run bench:test

      - name: Run all benchmark tasks
        id: bench
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          node bench/scripts/run-all.js \
            --model "$BENCH_MODEL" \
            --max-steps "$BENCH_MAX_STEPS" \
            --output-dir bench/results/github-actions

      - name: Upload benchmark results
        if: ${{ always() && steps.bench.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: aiui-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench/results/github-actions/
          if-no-files-found: error
          retention-days: 14
